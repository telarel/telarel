name: Docs

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - ".github/workflows/docs.yaml"
            - "docs/**"
            - "justfile"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    push:
        branches:
            - main
        paths:
            - ".github/workflows/docs.yaml"
            - "docs/**"
            - "justfile"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # Build
    build:
        name: Build
        if: github.event_name != "push"

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install just
              uses: extractions/setup-just@v4

            - name: Setup Node
              uses: alpheusci/setup-node@v1
              with:
                  node-version: "24"
                  auto-install: false

            - name: Install
              run: just i

            - name: Build docs
              run: just build-docs

    # Dispatch
    dispatch:
        name: Dispatch
        if: github.event_name == "push"

        runs-on: ubuntu-latest

        steps:
            - name: Trigger docs deployment
              env:
                  GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
              run: gh api repos/telarel/telarel.github.io/dispatches -f event_type=docs
