packages:
    - packages/*
    - packages/*/npm/*
    - tests/*
    - benchmarks/javascript
    - examples/javascript/*
    - docs

autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
    esbuild: false

overrides:
    "@emnapi/core": 2.0.0-alpha.5
    "@emnapi/runtime": 2.0.0-alpha.5
    emnapi: 2.0.0-alpha.5

catalogs:
    dep:
        vite: ^8.3.5
    test:
        vitest: ^5.0.5

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
    - "@apst/*"
    - "@napi-rs/*"
